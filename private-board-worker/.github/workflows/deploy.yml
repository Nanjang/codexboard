name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.example.jsonc'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      AUTH_RATE_LIMIT_NAMESPACE: ${{ vars.AUTH_RATE_LIMIT_NAMESPACE }}
      WRITE_RATE_LIMIT_NAMESPACE: ${{ vars.WRITE_RATE_LIMIT_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Render ignored Wrangler config
        run: npm run config:render

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
