version: '3.9'

services:
  mariadb:
    image: mariadb:11.7
    container_name: codexboard-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: codexboard
      MARIADB_USER: codexboard
      MARIADB_PASSWORD: codexboard
    ports:
      - '3306:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: codexboard-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mariadb_data:
  redis_data:
